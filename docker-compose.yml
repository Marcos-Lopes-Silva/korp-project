services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: korp
    ports:
      - "5432:5432"
  stock:
    build: ./packages/backend/services/stock
    environment:
      DB_HOST: postgres
      DB_NAME: stock_db
    depends_on:
      - postgres

  billing:
    build: ./packages/backend/services/billing
    environment:
      DB_HOST: postgres
      DB_NAME: billing_db
    depends_on:
      - postgres
  gateway:
    build: ./packages/backend/gateway
    environment:
      STOCK_SERVICE_URL: http://stock:8080
      BILLING_SERVICE_URL: http://billing:8080
    depends_on:
      - stock
      - billing

volumes:
  postgres_data: