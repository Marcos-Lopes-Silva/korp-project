services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  stock:
    build: ./packages/backend/services/stock
    environment:
      DB_HOST: postgres
      DB_NAME: stock_db
    depends_on:
      postgres:
        condition: service_healthy

  billing:
    build: ./packages/backend/services/billing
    environment:
      DB_HOST: postgres
      DB_NAME: billing_db
      STOCK_SERVICE_URL: http://stock:8081
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./packages/backend/gateway
    ports:
      - "8080:8080"
    environment:
      STOCK_SERVICE_URL: http://stock:8081
      BILLING_SERVICE_URL: http://billing:8082
    depends_on:
      - stock
      - billing

volumes:
  postgres_data: