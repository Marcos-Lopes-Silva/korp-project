<aside class="hidden md:flex w-60 shrink-0 flex-col h-full bg-forest-dark text-white/90 px-5 py-6">
  <div class="flex items-center gap-2.5 px-1 mb-10">
    <div class="w-8 h-8 rounded-full border border-white/25 flex items-center justify-center font-serif text-sm">K
    </div>
    <div>
      <p class="font-serif text-[15px] leading-none">Korp</p>
      <p class="text-[10px] uppercase tracking-wider text-white/45 mt-0.5">Notas Fiscais</p>
    </div>
  </div>

  <nav class="flex flex-col gap-1 text-sm">
    <a routerLink="/" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-white/65 hover:bg-white/5 hover:text-white transition-colors">
      <span class="w-1.5 h-1.5 rounded-full bg-white/30"></span> Painel
    </a>
    <a routerLink="/estoque" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-white/65 hover:bg-white/5 hover:text-white transition-colors">
      <span class="w-1.5 h-1.5 rounded-full bg-white/30"></span> Estoque
    </a>
    <a routerLink="/faturamento" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-white/65 hover:bg-white/5 hover:text-white transition-colors">
      <span class="w-1.5 h-1.5 rounded-full bg-white/30"></span> Faturamento
    </a>
  </nav>

  <div class="mt-auto pt-6 border-t border-white/10">
    <p class="text-[10px] uppercase tracking-wider text-white/40 mb-2">Status dos serviços</p>
    <ul class="space-y-1.5 text-[12.5px] text-white/70">
      @for (service of services(); track service.name) {
      <li class="flex items-center justify-between">
        <span>{{ service.name }}</span>
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full pulse-dot" [class.bg-emerald-400]="service.online"
            [class.bg-brick]="!service.online"></span>
          {{ service.online ? 'online' : 'indisponível' }}
        </span>
      </li>
      }
      @empty {
        <li>Carregando serviços..</li>
      }
    </ul>
  </div>
</aside>
