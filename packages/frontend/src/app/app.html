<main class="main">
  <div class="container mx-auto p-4 flex flex-col items-center justify-center min-h-screen">
    <h1 class="text-xl font-bold mb-4 font-archivo text-white">Login</h1>
    <h3 class="text-lg font-normal mb-4 text-white">Sistema de Emissão de Notas Fiscais</h3>
    <div class="shadow-md rounded-lg p-6 min-w-xl">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label for="email" class="block font-bold mb-2 text-white">Email</label>
          <input
            type="text"
            id="email"
            formControlName="email"
            class="w-full text-white px-3 py-2 focus:border-amber-900 hover:border focus:outline-0 hover:border-amber-900 border-amber-900/0 border transition-colors duration-150 rounded-lg placeholder-white/50"
            placeholder="Digite seu email"
          />
        </div>
        <div class="mb-4">
          <label for="password" class="block font-bold mb-2 text-white">Senha</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="w-full text-white px-3 py-2 focus:border-amber-900 focus:outline-0 hover:border-amber-900 border-amber-900/0 border transition-colors duration-150 rounded-lg placeholder-white/50"
            placeholder="Digite sua senha"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-amber-900 text-white font-bold py-2 px-4 rounded-lg hover:cursor-pointer hover:bg-amber-800 transition duration-300"
        >
          Entrar
        </button>
      </form>

    </div>
  </div>
</main>


<router-outlet />
